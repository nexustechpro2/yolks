name: Build and Push Yolks

on:
  push:
    branches:
      - main
    paths:
      - 'dockerfile-runner/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/yolks

jobs:
  build-dockerfile-runner:
    name: Build dockerfile-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dockerfile-runner
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfile-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dockerfile-runner
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dockerfile-runner-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
